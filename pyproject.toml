[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobooks"
version = "0.1.0"
description = "Local AI audiobook generator: book parsing, LLM speaker analysis, persistent character voices, Qwen3-TTS and FFmpeg assembly."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[project.optional-dependencies]
# Heavy, GPU-specific dependencies. PyTorch must be installed separately with the
# CUDA build that matches your driver (see README), then `pip install -e .[tts]`.
tts = [
    "qwen-tts>=0.1.1",
    "torch",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
]

[project.scripts]
audiobooks = "audiobooks.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiobooks = ["py.typed", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real_models: requires local llama-server / Qwen3-TTS / GPU (skipped unless AUDIOBOOKS_REAL_MODELS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# original Qwen3-TTS prototype script, kept as-is for reference
extend-exclude = ["test_tts.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # Cyrillic text in strings is intentional
    "RUF002",
    "RUF003",
    "B008",   # typer/fastapi defaults use function calls
]

[tool.ruff.format]
quote-style = "double"
